# main'ga har push'da saytni build qilib GitHub Pages'ga joylaydi: https://<user>.github.io/<repo>/
# Bir martalik sozlash: GitHub → repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # sayt /<repo>/ ichida ochiladi — vite base va router basename shu yo'ldan olinadi (vite.config.ts)
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages SPA manzillarni bilmaydi: /typescript/types kabi sahifa yangilanganda 404.html (ilovaning o'zi) ochiladi
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
